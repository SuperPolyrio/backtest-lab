schema_version: maker_live_probe_plan_v1
live_probe_enabled: true
account:
  expected_funder_address: "0x8D2418Aa7cc46fAD0FeA837fD873cDEDd27361b9"
  expected_signature_type: 2
  private_key_env: POLY_QUANT_PROBE_PRIVATE_KEY
  api_key_env: POLY_QUANT_PROBE_API_KEY
  api_secret_env: POLY_QUANT_PROBE_API_SECRET
  api_passphrase_env: POLY_QUANT_PROBE_API_PASSPHRASE
limits:
  # Maker outcome calibration may need the venue minimum at mid/high prices.
  max_order_notional: 5
  # All live BUY/SELL paths share the aggregate daily safety ceiling.
  max_daily_gross_notional: 20
  max_daily_realized_loss: 10
  # Share count may be large for low-price outcomes; max cash loss remains
  # bounded independently by max_order_notional and the aggregate daily cap.
  max_position_per_market: 5000
  max_open_orders: 1
  max_probes_per_hour: 10
market_policy:
  # The runner replaces this with exactly one reviewed --market-id.
  allow_market_ids: []
  deny_sports_initially: false
  deny_itode_initially: false
  min_seconds_to_scheduled_close: 3600
  require_redundant_lob: true
  require_rest_book_match: true
  require_user_ws_connected: true
  max_book_age_ms: 60000
safety:
  require_manual_run_approval: false
  kill_switch_file: /home/jiahuaiyu/.local/state/prediction-market-quant/live-probe.kill
  cancel_all_on_shutdown: true
  cancel_all_on_reconciliation_failure: true
network:
  clob_host: https://clob.polymarket.com
  chain_id: 137
  # Dedicated calibration route; it does not alter the active clashsub profile.
  proxy_url: http://127.0.0.1:17982
  read_proxy_urls:
    - http://127.0.0.1:17982
  read_attempts: 3
  read_retry_seconds: 0.5
  max_server_clock_offset_ms: 1000
execution:
  count: 1
  sides: [BUY]
  order_types: [GTC]
  amount: 1
  amount_unit: SHARES
  interval_seconds: 0
  expected_outcome: ANY
  price_mode: BBO_ONLY
